version: "3.9"

services:
  app:
    build: ../book-socialing-app
    container_name: app
    ports:
      - "8080:8080"
    restart: always
    env_file:
      - ../.env

  frontend:
    build:
      context: ..
      dockerfile: book-socialing-fe/Dockerfile
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - app
    restart: always
